<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Login – ScholarPredict</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
    body{min-height:100vh;background:linear-gradient(135deg,#e0e7ff 0%,#f0f9ff 50%,#e0f2fe 100%);display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(99,102,241,.12);padding:44px 40px;width:100%;max-width:420px;}
    .logo{text-align:center;margin-bottom:28px;}
    .logo .icon{font-size:2.8rem;display:block;margin-bottom:10px;}
    .logo h1{font-size:1.4rem;font-weight:800;color:#1e293b;}
    .logo p{font-size:.82rem;color:#94a3b8;margin-top:4px;}
    .admin-badge{display:inline-block;background:#ede9fe;color:#7c3aed;font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:.78rem;font-weight:600;color:#374151;margin-bottom:6px;}
    .input-wrap{position:relative;}
    .input-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1rem;color:#94a3b8;}
    input[type=email],input[type=password]{width:100%;padding:11px 14px 11px 40px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:.875rem;color:#1e293b;outline:none;transition:border .2s,box-shadow .2s;background:#fafafa;}
    input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.1);background:#fff;}
    .error-box{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:11px 14px;border-radius:10px;font-size:.82rem;margin-bottom:18px;display:flex;align-items:center;gap:8px;}
    .btn-login{width:100%;padding:13px;background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:.02em;}
    .btn-login:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(99,102,241,.35);}
    .btn-login:active{transform:none;}
    .back-link{text-align:center;margin-top:20px;}
    .back-link a{color:#94a3b8;font-size:.8rem;text-decoration:none;}
    .back-link a:hover{color:#6366f1;}
    .hint{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:12px 14px;margin-top:20px;font-size:.75rem;color:#0369a1;}
    .hint strong{display:block;margin-bottom:4px;font-weight:700;}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <span class="icon">🎓</span>
    <h1>ScholarPredict</h1>
    <p>University Scholarship Eligibility Predictor</p>
    <span class="admin-badge">⭐ Admin Portal</span>
  </div>

  {% if error %}
  <div class="error-box">❌ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/admin/login">
    <div class="form-group">
      <label>Admin Email</label>
      <div class="input-wrap">
        <span class="icon">📧</span>
        <input type="email" name="email" placeholder="admin123@gmail.com" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <span class="icon">🔒</span>
        <input type="password" name="password" placeholder="Enter admin password" required>
      </div>
    </div>
    <button type="submit" class="btn-login">🔐 Sign In to Admin Panel</button>
  </form>

  <div class="back-link"><a href="/">← Back to main site</a></div>

  <div class="hint">
    <strong>🔑 Default Admin Credentials</strong>
    Email: admin123@gmail.com<br>
    Password: Admin@2025!
  </div>
</div>
</body>
</html>
